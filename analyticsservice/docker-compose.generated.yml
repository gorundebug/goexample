services:
  analyticsservice:
    image: analyticsservice:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
      additional_contexts:
        servicelib-source: "${GOSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/servicelib.git#v0.2.24}"
        module-model-source: "${MODEL_SOURCE_CONTEXT:-https://github.com/gorundebug/model.git#v0.2.14}"
    environment:
      - DEBUG=${DEBUG:-0}
    ports:
      - "9093:9093"
      - "9203:9203"
      - "2345:2345"